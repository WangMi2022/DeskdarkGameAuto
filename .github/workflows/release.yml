name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm run test:helper

      - name: Build portable package
        run: npm run portable

      - name: Package zip archive
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $version = $pkg.version
          $folder = "dist-portable-final-v${version}\PlacegameAutoHelper-win32-x64"
          $zipName = "PlacegameAutoHelper-v${version}-windows-x64.zip"
          Compress-Archive -Path $folder -DestinationPath $zipName -Force
          Write-Host "Created $zipName"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: PlacegameAutoHelper-*-windows-x64.zip
          generate_release_notes: true
          draft: false
          prerelease: false
